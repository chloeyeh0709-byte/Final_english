<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三次段考英文複習</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f0e8;
    --paper-dark: #ede7d4;
    --paper-lines: #d4c9a8;
    --ink: #2c2416;
    --ink-light: #6b5c3e;
    --ink-faint: #a89470;
    --red: #c0392b;
    --blue: #2563a8;
    --green: #2d6a4f;
    --highlight: #f9e4a0;
    --ring: #8b7355;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #c9b99a;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 11px);
    font-family: 'Noto Serif TC', serif;
    min-height: 100vh;
    padding: 20px;
  }

  /* HOME */
  #home {
    max-width: 480px;
    margin: 0 auto;
    padding-top: 20px;
  }
  .notebook-cover {
    background: #3d2b1f;
    border-radius: 4px 12px 12px 4px;
    padding: 40px 30px;
    box-shadow: -4px 4px 0 #1a0f0a, 4px 4px 20px rgba(0,0,0,0.4);
    position: relative;
    border-left: 20px solid #2a1d14;
  }
  .notebook-cover::before {
    content: '';
    position: absolute;
    left: -8px; top: 10%; bottom: 10%;
    width: 4px;
    background: repeating-linear-gradient(to bottom, #c9a96e 0, #c9a96e 8px, #3d2b1f 8px, #3d2b1f 14px);
    border-radius: 2px;
  }
  .cover-title {
    font-family: 'Caveat', cursive;
    color: #f5e6c8;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .cover-sub {
    font-family: 'Caveat', cursive;
    color: #c9a96e;
    font-size: 1.1rem;
    margin-bottom: 30px;
  }
  .cover-label {
    display: inline-block;
    background: #f5e6c8;
    color: #3d2b1f;
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 6px;
    transform: rotate(-1deg);
  }
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 24px;
  }
  .mode-btn {
    background: var(--paper);
    border: 2px solid var(--paper-lines);
    border-radius: 8px;
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    box-shadow: 2px 2px 0 var(--paper-lines);
    font-family: 'Caveat', cursive;
  }
  .mode-btn:hover { transform: translateY(-2px); box-shadow: 2px 4px 0 var(--paper-lines); }
  .mode-btn:active { transform: translateY(0); box-shadow: 1px 1px 0 var(--paper-lines); }
  .mode-btn .mode-icon { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .mode-btn .mode-name { font-size: 1rem; font-weight: 700; color: var(--ink); display: block; }
  .mode-btn .mode-desc { font-size: 0.75rem; color: var(--ink-light); display: block; margin-top: 2px; }
  .mode-btn.full { grid-column: 1 / -1; }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; }

  /* NOTEBOOK PAGE */
  .page-wrap {
    max-width: 480px;
    margin: 0 auto;
  }
  .page {
    background: var(--paper);
    border-radius: 4px 8px 8px 4px;
    box-shadow: -3px 3px 0 #8b7355, 3px 3px 15px rgba(0,0,0,0.25);
    position: relative;
    min-height: 80vh;
    border-left: 40px solid #e8dfc0;
    overflow: hidden;
  }
  .page::before {
    content: '';
    position: absolute;
    left: -28px; top: 0; bottom: 0;
    width: 2px;
    background: var(--red);
    opacity: 0.5;
  }
  .page-rings {
    position: absolute;
    left: -34px;
    top: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 20px 0;
    pointer-events: none;
  }
  .ring {
    width: 16px; height: 16px;
    border: 2px solid var(--ring);
    border-radius: 50%;
    background: #c9b99a;
  }
  .page-lines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 27px, var(--paper-lines) 27px, var(--paper-lines) 28px);
    background-position: 0 50px;
    opacity: 0.4;
    pointer-events: none;
  }
  .page-content {
    position: relative;
    z-index: 1;
    padding: 16px 20px 20px;
  }

  /* HEADER BAR */
  .page-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--paper-lines);
    padding-bottom: 10px;
  }
  .back-btn {
    background: none;
    border: 1.5px solid var(--ink-faint);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Caveat', cursive;
    font-size: 0.9rem;
    color: var(--ink-light);
  }
  .page-title {
    font-family: 'Caveat', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--ink);
    flex: 1;
  }
  .progress-badge {
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    color: var(--ink-faint);
    background: var(--paper-dark);
    border-radius: 20px;
    padding: 2px 10px;
  }

  /* FLASHCARD */
  .card-area {
    perspective: 1000px;
    margin: 10px 0 16px;
  }
  .card-inner {
    position: relative;
    width: 100%;
    min-height: 200px;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    cursor: pointer;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    min-height: 200px;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card-front {
    background: linear-gradient(135deg, #fff8ec 0%, #fef3d7 100%);
    border: 2px solid var(--paper-lines);
  }
  .card-back {
    background: linear-gradient(135deg, #e8f4e8 0%, #d4ead4 100%);
    border: 2px solid #9dc49d;
    transform: rotateY(180deg);
  }
  .card-face.phrase-front {
    background: linear-gradient(135deg, #fff0e0 0%, #ffe4c4 100%);
    border: 2px solid #e0b880;
  }
  .card-face.phrase-back {
    background: linear-gradient(135deg, #e8f0ff 0%, #d4e4ff 100%);
    border: 2px solid #90b0e0;
    transform: rotateY(180deg);
  }
  .card-label {
    font-family: 'Caveat', cursive;
    font-size: 0.75rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .card-word {
    font-family: 'Caveat', cursive;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }
  .card-zh {
    font-size: 1.3rem;
    font-weight: 500;
    color: var(--ink);
    margin-top: 8px;
  }
  .card-pos {
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    color: var(--blue);
    margin-top: 6px;
  }
  .card-hint {
    font-family: 'Caveat', cursive;
    font-size: 0.8rem;
    color: var(--ink-faint);
    margin-top: 20px;
  }
  .card-lesson {
    position: absolute;
    top: 10px;
    right: 14px;
    font-family: 'Caveat', cursive;
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  .card-nav {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 4px;
  }
  .nav-btn {
    background: var(--paper-dark);
    border: 1.5px solid var(--paper-lines);
    border-radius: 8px;
    padding: 8px 24px;
    font-family: 'Caveat', cursive;
    font-size: 1rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.1s;
    box-shadow: 1px 1px 0 var(--paper-lines);
  }
  .nav-btn:hover { background: var(--highlight); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .nav-btn.primary:hover { background: #4a3824; }
  .shuffle-btn {
    background: none;
    border: none;
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    color: var(--blue);
    cursor: pointer;
    text-decoration: underline;
    margin: 0 auto;
    display: block;
    margin-top: 8px;
  }

  /* SPELLING */
  .spell-question {
    background: var(--highlight);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin: 10px 0 14px;
    border: 1.5px dashed var(--paper-lines);
  }
  .spell-zh {
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .spell-pos {
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    color: var(--blue);
    margin-bottom: 4px;
  }
  .spell-lesson-tag {
    font-family: 'Caveat', cursive;
    font-size: 0.8rem;
    color: var(--ink-faint);
  }
  .spell-input-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .spell-input {
    width: 100%;
    background: white;
    border: 2px solid var(--paper-lines);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .spell-input:focus { border-color: var(--blue); }
  .spell-input.correct { border-color: var(--green); background: #f0fff0; }
  .spell-input.wrong { border-color: var(--red); background: #fff0f0; }
  .spell-feedback {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 1rem;
    margin-bottom: 10px;
    min-height: 24px;
  }
  .spell-feedback.correct { color: var(--green); }
  .spell-feedback.wrong { color: var(--red); }
  .spell-answer-reveal {
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 8px;
  }
  .spell-answer-reveal strong { color: var(--green); font-size: 1rem; }

  /* WRONG LIST */
  .wrong-list {
    background: #fff5f5;
    border: 1.5px solid #e0b0b0;
    border-radius: 8px;
    padding: 14px;
    margin-top: 12px;
  }
  .wrong-list h3 {
    font-family: 'Caveat', cursive;
    font-size: 1rem;
    color: var(--red);
    margin-bottom: 8px;
  }
  .wrong-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid #f0d0d0;
    font-size: 0.85rem;
    font-family: 'Caveat', cursive;
    color: var(--ink);
  }
  .wrong-item:last-child { border-bottom: none; }
  .wrong-item span:last-child { color: var(--ink-faint); }

  /* SUMMARY */
  .summary-box {
    background: var(--paper-dark);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    margin: 10px 0;
  }
  .summary-score {
    font-family: 'Caveat', cursive;
    font-size: 3rem;
    font-weight: 700;
    color: var(--ink);
  }
  .summary-label { font-family: 'Caveat', cursive; color: var(--ink-light); }

  /* PROGRESS BAR */
  .prog-bar-wrap {
    height: 6px;
    background: var(--paper-lines);
    border-radius: 3px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .prog-bar-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 3px;
    transition: width 0.3s;
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="notebook-cover">
    <div class="cover-label">第三次段考</div>
    <div class="cover-title">英文複習本</div>
    <div class="cover-sub">L7–L9 Notes ✦ L1–9 Vocab</div>
  </div>
  <div class="mode-grid" style="margin-top:16px;">
    <button class="mode-btn" onclick="startFlashcard('vocab')">
      <span class="mode-icon">🃏</span>
      <span class="mode-name">單字卡</span>
      <span class="mode-desc">L1-9 全部單字</span>
    </button>
    <button class="mode-btn" onclick="startSpelling()">
      <span class="mode-icon">✍️</span>
      <span class="mode-name">中文拼英文</span>
      <span class="mode-desc">L1-9 全部單字</span>
    </button>
    <button class="mode-btn" onclick="startFlashcard('phrase')">
      <span class="mode-icon">💬</span>
      <span class="mode-name">片語卡</span>
      <span class="mode-desc">L7-9 筆記片語</span>
    </button>
    <button class="mode-btn" onclick="startFlashcard('supplement')">
      <span class="mode-icon">📌</span>
      <span class="mode-name">補充卡</span>
      <span class="mode-desc">L7-9 家族字彙</span>
    </button>
  </div>
</div>

<!-- FLASHCARD SCREEN -->
<div id="flashcard-screen" class="screen">
  <div class="page-wrap">
    <div class="page">
      <div class="page-lines"></div>
      <div class="page-rings">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div>
      </div>
      <div class="page-content">
        <div class="page-header">
          <button class="back-btn" onclick="goHome()">← 返回</button>
          <div class="page-title" id="fc-title">單字卡</div>
          <div class="progress-badge" id="fc-progress">1 / 1</div>
        </div>
        <div class="prog-bar-wrap"><div class="prog-bar-fill" id="fc-bar" style="width:0%"></div></div>
        <div class="card-area">
          <div class="card-inner" id="card-inner" onclick="flipCard()">
            <div class="card-face card-front" id="card-front">
              <div class="card-label">點擊翻面</div>
              <div class="card-word" id="card-word-en">—</div>
              <div class="card-lesson" id="card-lesson-tag"></div>
              <div class="card-hint">tap to flip</div>
            </div>
            <div class="card-face card-back" id="card-back">
              <div class="card-label">中文意思</div>
              <div class="card-zh" id="card-word-zh">—</div>
              <div class="card-pos" id="card-pos"></div>
              <div class="card-word" id="card-back-en" style="font-size:1rem;color:var(--ink-faint);margin-top:8px"></div>
            </div>
          </div>
        </div>
        <div class="card-nav">
          <button class="nav-btn" id="fc-prev" onclick="fcNav(-1)">← 上一張</button>
          <button class="nav-btn" id="fc-next" onclick="fcNav(1)">下一張 →</button>
        </div>
        <button class="shuffle-btn" onclick="fcShuffle()">🔀 重新洗牌</button>
      </div>
    </div>
  </div>
</div>

<!-- SPELLING SCREEN -->
<div id="spelling-screen" class="screen">
  <div class="page-wrap">
    <div class="page">
      <div class="page-lines"></div>
      <div class="page-rings">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div>
      </div>
      <div class="page-content">
        <div class="page-header">
          <button class="back-btn" onclick="goHome()">← 返回</button>
          <div class="page-title">中文拼英文</div>
          <div class="progress-badge" id="sp-progress">1 / 1</div>
        </div>
        <div class="prog-bar-wrap"><div class="prog-bar-fill" id="sp-bar" style="width:0%"></div></div>
        <div class="spell-question">
          <div class="spell-zh" id="sp-zh">—</div>
          <div class="spell-pos" id="sp-pos"></div>
          <div class="spell-lesson-tag" id="sp-tag"></div>
        </div>
        <div class="spell-input-wrap">
          <input class="spell-input" id="sp-input" type="text" placeholder="拼出英文…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" onkeydown="spKeydown(event)">
        </div>
        <div class="spell-feedback" id="sp-feedback"></div>
        <div class="spell-answer-reveal" id="sp-reveal"></div>
        <div class="card-nav">
          <button class="nav-btn" id="sp-skip" onclick="spSkip()">跳過</button>
          <button class="nav-btn primary" id="sp-submit" onclick="spSubmit()">確認</button>
          <button class="nav-btn" id="sp-next" onclick="spNext()" style="display:none">下一題 →</button>
        </div>
        <div id="sp-wrong-wrap"></div>
      </div>
    </div>
  </div>
</div>

// Supplement = L7-9 vocab with non-plain entries (phrases/collocations as entries)
const SUPPLEMENT = VOCAB.filter(v => v[2] >= 7 && v[0].includes(' '));
const VOCAB_MAIN = VOCAB; // all vocab for flashcard

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---- NAV ----
function goHome() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('home').classList.add('active');
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ---- FLASHCARD ----
let fcDeck = [];
let fcIdx = 0;
let fcMode = 'vocab'; // vocab | phrase | supplement

function startFlashcard(mode) {
  fcMode = mode;
  if (mode === 'vocab') {
    fcDeck = shuffle(VOCAB_MAIN);
    document.getElementById('fc-title').textContent = '單字卡 (L1-9)';
  } else if (mode === 'phrase') {
    fcDeck = shuffle(PHRASES.map(p => [p[0], p[1], '7-9']));
    document.getElementById('fc-title').textContent = '片語卡 (L7-9)';
  } else {
    fcDeck = shuffle(SUPPLEMENT);
    document.getElementById('fc-title').textContent = '補充卡 (L7-9)';
  }
  fcIdx = 0;
  renderCard();
  showScreen('flashcard-screen');
}

function renderCard() {
  const card = fcDeck[fcIdx];
  const inner = document.getElementById('card-inner');
  inner.classList.remove('flipped');
  document.getElementById('card-word-en').textContent = card[0];
  document.getElementById('card-word-zh').textContent = card[1];
  document.getElementById('card-back-en').textContent = card[0];
  document.getElementById('card-pos').textContent = (fcMode === 'vocab' && card[3]) ? card[3] : '';
  const lessonTag = card[2] ? (typeof card[2] === 'number' ? 'L' + card[2] : card[2]) : '';
  document.getElementById('card-lesson-tag').textContent = lessonTag;

  // phrase vs vocab styling
  const front = document.getElementById('card-front');
  const back = document.getElementById('card-back');
  if (fcMode === 'phrase') {
    front.classList.add('phrase-front'); front.classList.remove('card-front');
    back.classList.add('phrase-back'); back.classList.remove('card-back');
  } else {
    front.classList.add('card-front'); front.classList.remove('phrase-front');
    back.classList.add('card-back'); back.classList.remove('phrase-back');
  }

  const total = fcDeck.length;
  document.getElementById('fc-progress').textContent = (fcIdx+1) + ' / ' + total;
  document.getElementById('fc-bar').style.width = ((fcIdx+1)/total*100) + '%';
  document.getElementById('fc-prev').disabled = fcIdx === 0;
  document.getElementById('fc-next').disabled = fcIdx === total - 1;
}

function flipCard() {
  document.getElementById('card-inner').classList.toggle('flipped');
}
function fcNav(dir) {
  fcIdx = Math.max(0, Math.min(fcDeck.length-1, fcIdx + dir));
  renderCard();
}
function fcShuffle() {
  if (fcMode === 'vocab') fcDeck = shuffle(VOCAB_MAIN);
  else if (fcMode === 'phrase') fcDeck = shuffle(PHRASES.map(p => [p[0], p[1], '7-9']));
  else fcDeck = shuffle(SUPPLEMENT);
  fcIdx = 0;
  renderCard();
}

// ---- SPELLING ----
let spDeck = [];
let spIdx = 0;
let spAnswered = false;
let spWrong = [];

function startSpelling() {
  spDeck = shuffle(VOCAB_MAIN);
  spIdx = 0;
  spWrong = [];
  spAnswered = false;
  renderSpell();
  showScreen('spelling-screen');
}

function renderSpell() {
  if (spIdx >= spDeck.length) {
    showSpellSummary(); return;
  }
  const card = spDeck[spIdx];
  document.getElementById('sp-zh').textContent = card[1];
  document.getElementById('sp-pos').textContent = card[3] || '';
  document.getElementById('sp-tag').textContent = 'L' + card[2];
  document.getElementById('sp-input').value = '';
  document.getElementById('sp-input').className = 'spell-input';
  document.getElementById('sp-feedback').textContent = '';
  document.getElementById('sp-feedback').className = 'spell-feedback';
  document.getElementById('sp-reveal').innerHTML = '';
  document.getElementById('sp-submit').style.display = '';
  document.getElementById('sp-skip').style.display = '';
  document.getElementById('sp-next').style.display = 'none';
  document.getElementById('sp-wrong-wrap').innerHTML = '';
  spAnswered = false;
  const total = spDeck.length;
  document.getElementById('sp-progress').textContent = (spIdx+1) + ' / ' + total;
  document.getElementById('sp-bar').style.width = ((spIdx+1)/total*100) + '%';
  setTimeout(() => document.getElementById('sp-input').focus(), 100);
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/[''`]/g, "'").replace(/\s+/g, ' ');
}

function spSubmit() {
  if (spAnswered) return;
  const card = spDeck[spIdx];
  const ans = normalize(document.getElementById('sp-input').value);
  const correct = normalize(card[0]);
  const input = document.getElementById('sp-input');
  const fb = document.getElementById('sp-feedback');
  const rev = document.getElementById('sp-reveal');
  spAnswered = true;
  if (ans === correct) {
    input.classList.add('correct');
    fb.textContent = '✓ 正確！';
    fb.className = 'spell-feedback correct';
  } else {
    input.classList.add('wrong');
    fb.textContent = '✗ 錯誤';
    fb.className = 'spell-feedback wrong';
    rev.innerHTML = '正確答案：<strong>' + card[0] + '</strong>';
    spWrong.push(card);
  }
  document.getElementById('sp-submit').style.display = 'none';
  document.getElementById('sp-skip').style.display = 'none';
  document.getElementById('sp-next').style.display = '';
}

function spSkip() {
  const card = spDeck[spIdx];
  spWrong.push(card);
  const rev = document.getElementById('sp-reveal');
  rev.innerHTML = '答案：<strong>' + card[0] + '</strong>';
  spAnswered = true;
  document.getElementById('sp-submit').style.display = 'none';
  document.getElementById('sp-skip').style.display = 'none';
  document.getElementById('sp-next').style.display = '';
}

function spNext() {
  spIdx++;
  if (spIdx >= spDeck.length) showSpellSummary();
  else renderSpell();
}

function spKeydown(e) {
  if (e.key === 'Enter') {
    if (!spAnswered) spSubmit();
    else spNext();
  }
}

function showSpellSummary() {
  const total = spDeck.length;
  const wrong = spWrong.length;
  const correct = total - wrong;
  let html = `<div class="summary-box">
    <div class="summary-score">${correct} / ${total}</div>
    <div class="summary-label">答對題數</div>
  </div>`;
  if (wrong > 0) {
    html += `<div class="wrong-list"><h3>✗ 錯誤單字 (${wrong})</h3>`;
    spWrong.forEach(w => {
      html += `<div class="wrong-item"><span>${w[0]}</span><span>${w[1]}</span></div>`;
    });
    html += `</div>`;
  }
  html += `<div class="card-nav" style="margin-top:14px">
    <button class="nav-btn primary" onclick="startSpelling()">重新開始</button>
    <button class="nav-btn" onclick="goHome()">返回首頁</button>
  </div>`;
  document.getElementById('spelling-screen').querySelector('.page-content').innerHTML = html;
}
</script>
